<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mein Zugang – WohnStart</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="Dein persönlicher WohnStart-Zugang." />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg:#FBFCFD; --surface:#FFFFFF; --ink:#0E1A2B; --ink-soft:#4A5568; --line:#E3E8EF; --blue-deep:#1E3F73; --blue-tint:#EAF1FB; --green:#1F7A5C; --green-tint:#E7F5EF; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0); }
  .font-display { font-family: 'Fraunces', serif; }
  .surface { background: var(--surface); border: 1px solid var(--line); }
  .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
</style>
</head>
<body class="min-h-screen px-5 py-12">
  <div class="max-w-2xl mx-auto surface rounded-2xl p-8" id="content">
    <p style="color:var(--ink-soft)">Zugriff wird überprüft…</p>
  </div>

<script>
(function () {
  "use strict";
  var params = new URLSearchParams(window.location.search);
  var sessionId = params.get("session_id");
  var content = document.getElementById("content");

  function renderLocked() {
    content.innerHTML =
      '<h1 class="font-display text-2xl font-semibold" style="color:var(--ink)">Kein Zugriff gefunden</h1>' +
      '<p class="text-sm mt-3" style="color:var(--ink-soft)">Wir konnten für diesen Link keine bezahlte Bestellung finden. Wenn du gerade bezahlt hast, ist dein Zugang eventuell noch in Bearbeitung — versuche es in Kürze erneut, oder starte über deinen Bestätigungslink neu.</p>' +
      '<a href="/#kurs" class="btn-secondary inline-block mt-6 px-5 py-3 rounded-lg font-semibold">Zu WohnStart Komplett</a>';
  }

  function renderUnlocked(order) {
    var featuresHtml = (order.features || []).map(function (f) {
      return '<li class="flex gap-2 text-sm"><span style="color:var(--green)">✓</span><span style="color:var(--ink)">' + f + '</span></li>';
    }).join("");

    content.innerHTML =
      '<p class="text-sm font-semibold" style="color:var(--blue-deep)">' + order.packageName + '</p>' +
      '<h1 class="font-display text-2xl font-semibold mt-1" style="color:var(--ink)">Deine Dokumente</h1>' +
      '<ul class="flex flex-col gap-2 mt-5">' + featuresHtml + '</ul>' +

      // WohnStart Komplett: this page also unlocks the browser (httpOnly cookie set by /api/order-status).
      '<div class="rounded-xl p-5 mt-6" style="background:var(--green-tint)">' +
        '<p class="font-semibold" style="color:var(--ink)">WohnStart Komplett ist in diesem Browser freigeschaltet.</p>' +
        '<p class="text-sm mt-1" style="color:var(--ink-soft)">Gib deine Angaben einmal ein, erstelle deine Dokumente automatisch und organisiere deine Unterlagen.</p>' +
        '<div class="flex flex-wrap gap-2 mt-4">' +
          '<a href="/#mein-wohnstart" class="inline-block px-5 py-3 rounded-lg font-semibold" style="background:var(--blue-deep);color:white">Mein WohnStart öffnen</a>' +
          '<a href="/#angaben" class="btn-secondary inline-block px-5 py-3 rounded-lg font-semibold">Meine Angaben</a>' +
          '<a href="/#dokument-erstellen" class="btn-secondary inline-block px-5 py-3 rounded-lg font-semibold">Dokumente erstellen</a>' +
          '<a href="/#unterlagen" class="btn-secondary inline-block px-5 py-3 rounded-lg font-semibold">Meine Unterlagen</a>' +
        '</div>' +
        '<p class="text-xs mt-3" style="color:var(--ink-soft)">Auf einem anderen Gerät? Öffne diesen Link dort einmal, um WohnStart Komplett auch dort freizuschalten.</p>' +
      '</div>' +

      '<div class="rounded-xl p-5 mt-6" style="border:2px solid var(--blue-deep)">' +
        '<p class="font-semibold" style="color:var(--ink)">KI-Dokumenten-Check</p>' +
        '<p class="text-sm mt-1" style="color:var(--ink-soft)">Lade deine Unterlagen hoch und lass sie vor der Bewerbung automatisch auf Lesbarkeit, Vollständigkeit und Gültigkeit prüfen.</p>' +
        '<a href="/#ki-check" class="inline-block mt-4 px-5 py-3 rounded-lg font-semibold" style="background:var(--blue-deep);color:white">Unterlagen prüfen lassen</a>' +
      '</div>' +

      '<div class="rounded-xl p-4 mt-6" style="background:var(--blue-tint)">' +
  '<p class="font-semibold text-sm" style="color:var(--blue-deep)">Mieterselbstauskunft (leer)</p>' +
  '<p class="text-sm mt-1" style="color:var(--ink-soft)">Leere Vorlage zum Ausdrucken. Automatisch ausgefüllt bekommst du sie unter „Dokumente erstellen“.</p>' +
  '<a href="/api/download/mieterselbstauskunft?session_id=' + encodeURIComponent(sessionId) + '" class="inline-block mt-4 px-5 py-3 rounded-lg font-semibold" style="background:var(--blue-deep);color:white">PDF herunterladen</a>' +
'</div>' +
'<div class="rounded-xl p-4 mt-4" style="background:var(--blue-tint)">' +
  '<p class="font-semibold text-sm" style="color:var(--blue-deep)">Wohnungsbewerbung Checkliste</p>' +
  '<p class="text-sm mt-1" style="color:var(--ink-soft)">Schritt für Schritt durch deine Wohnungsbewerbung.</p>' +
  '<a href="/api/download/wohnungsbewerbung?session_id=' + encodeURIComponent(sessionId) + '" class="inline-block mt-4 px-5 py-3 rounded-lg font-semibold" style="background:var(--blue-deep);color:white">PDF herunterladen</a>' +
'</div>' +

      '<a href="/" class="btn-secondary inline-block mt-6 px-5 py-3 rounded-lg font-semibold">Zur Startseite</a>';
  }

  if (!sessionId) {
    renderLocked();
  } else {
    fetch("/api/order-status?session_id=" + encodeURIComponent(sessionId))
      .then(function (res) { return res.json(); })
      .then(function (order) {
        // Access is granted here ONLY because the backend already verified
        // (via the Stripe webhook) that this session is paid — this page
        // never decides that on its own.
        if (order.status === "paid") {
          renderUnlocked(order);
        } else {
          renderLocked();
        }
      })
      .catch(renderLocked);
  }
})();
</script>
</body>
</html>
