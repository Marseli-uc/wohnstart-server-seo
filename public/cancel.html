<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Zahlung abgebrochen – WohnStart</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="Der Bezahlvorgang wurde abgebrochen." />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg:#FBFCFD; --surface:#FFFFFF; --ink:#0E1A2B; --ink-soft:#4A5568; --line:#E3E8EF; --blue-deep:#1E3F73; --amber:#B4790A; --amber-tint:#FBF1E0; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; padding: env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0); }
  .font-display { font-family: 'Fraunces', serif; }
  .surface { background: var(--surface); border: 1px solid var(--line); }
  .btn-primary { background: var(--blue-deep); color: #fff; }
  .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-5 py-12">
  <div class="w-full max-w-lg surface rounded-2xl p-8 text-center">
    <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center" style="background:var(--amber-tint)">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 6v5" stroke="#B4790A" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="14" r="1" fill="#B4790A"/></svg>
    </div>
    <h1 class="font-display text-2xl font-semibold mt-4" style="color:var(--ink)">Zahlung abgebrochen</h1>
    <p class="text-sm mt-3" style="color:var(--ink-soft)">Der Bezahlvorgang wurde abgebrochen. Es wurde keine Zahlung durchgeführt und dir wurde nichts berechnet.</p>
    <div class="flex flex-col gap-2 mt-7">
      <a href="/#kurs" class="btn-primary px-5 py-3 rounded-lg font-semibold">Zurück zur Paketauswahl</a>
      <a href="/" class="btn-secondary px-5 py-3 rounded-lg font-semibold">Zur Startseite</a>
    </div>
  </div>
</body>
</html>
